<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="How one item becomes a pull request: you ask in plain words and the lead writes the item; the strong model writes a spec; the cheap model implements and commits; programs run the checks, the scope check and the integrity scan; the strong model reviews and can send one fix round; on a clean checkout programs repeat the checks and the red-green test while an auditor drives the change in its own session; the evidence card is written and the pull request opens; you merge it.">
  <rect x="1" y="1" width="1278" height="698" rx="12" fill="#FAFAFA" stroke="#D4D4D4" stroke-width="1.5"/>
  <path d="M 1 13 Q 1 1 13 1 H 1267 Q 1279 1 1279 13 V 40 H 1 Z" fill="#EFEFEF"/>
  <path d="M 1 40 H 1279" stroke="#D4D4D4" stroke-width="1"/>
  <circle cx="22" cy="21" r="6" fill="#C8C8C8"/><circle cx="42" cy="21" r="6" fill="#C8C8C8"/><circle cx="62" cy="21" r="6" fill="#C8C8C8"/>
  <text x="640" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle" fill="#6B6B6B">mend-autopilot: one item, one pull request</text>
  <path d="M 410 106 H 904 M 410 100 V 112 M 904 100 V 112" stroke="#D4D4D4" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
  <text x="657" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#6B6B6B">mend-lite</text>
  <path d="M 926 106 H 1248 M 926 100 V 112 M 1248 100 V 112" stroke="#D4D4D4" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
  <text x="1087" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#6B6B6B">mend-lite-pr</text>
  <rect x="28" y="136" width="1224" height="116" rx="10" fill="none" stroke="#E2E2E2"/>
  <text x="48" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#0A0A0A">You</text>
  <text x="48" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">ask for the change,</text>
  <text x="48" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">merge the PR</text>
  <rect x="28" y="260" width="1224" height="116" rx="10" fill="none" stroke="#E2E2E2"/>
  <text x="48" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#0A0A0A">Strong model</text>
  <text x="48" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">specs and reviews,</text>
  <text x="48" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">never writes code</text>
  <rect x="28" y="384" width="1224" height="116" rx="10" fill="none" stroke="#E2E2E2"/>
  <text x="48" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#0A0A0A">Cheap model</text>
  <text x="48" y="455" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">does the work in</text>
  <text x="48" y="473" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">its own worktree</text>
  <rect x="28" y="508" width="1224" height="116" rx="10" fill="none" stroke="#E2E2E2"/>
  <text x="48" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#0A0A0A">Programs</text>
  <text x="48" y="579" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">decide what counts</text>
  <text x="48" y="597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B6B">as verified</text>
  <rect x="238" y="155" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="313" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">your request</text><text x="313" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">in plain words</text>
  <rect x="410" y="279" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="485" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">spec</text>
  <rect x="582" y="403" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#6F8A5C" stroke-width="1.5" stroke-dasharray="5 5"/><text x="657" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">implement</text><text x="657" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">and commit</text>
  <rect x="754" y="527" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="829" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">checks, scope</text><text x="829" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">integrity</text>
  <rect x="754" y="279" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="829" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">review</text>
  <rect x="926" y="527" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="1001" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">checks again</text><text x="1001" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">red-green</text>
  <rect x="926" y="279" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="1001" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">auditor</text><text x="1001" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">own session</text>
  <rect x="1098" y="527" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#2F7A6F" stroke-width="1.5"/><text x="1173" y="571" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#2F7A6F">evidence card</text>
  <rect x="1098" y="155" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><text x="1173" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">pull request</text><text x="1173" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#0A0A0A">you merge</text>
