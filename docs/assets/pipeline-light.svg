  <text x="48" y="664" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6B6B6B">Any step can stop the item with its reason: blocked, or draft when its rounds are spent.</text>
