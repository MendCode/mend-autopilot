<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="How one item becomes a pull request: you write the item; the strong model writes a spec; the cheap model implements and commits; programs run the checks, the scope check and the integrity scan; the strong model reviews and can send one fix round; on a clean checkout programs repeat the checks and the red-green test while an auditor drives the change in its own session; the evidence card is written; you approve the merge.">
  <rect x="1" y="1" width="1278" height="698" rx="12" fill="#0A0A0A" stroke="#3A3F3C" stroke-width="1.5"/>
  <path d="M 1 13 Q 1 1 13 1 H 1267 Q 1279 1 1279 13 V 40 H 1 Z" fill="#141414"/>
  <path d="M 1 40 H 1279" stroke="#3A3F3C" stroke-width="1"/>
  <circle cx="22" cy="21" r="6" fill="#3A3A3A"/><circle cx="42" cy="21" r="6" fill="#3A3A3A"/><circle cx="62" cy="21" r="6" fill="#3A3A3A"/>
  <text x="640" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" text-anchor="middle" fill="#8A8A8A">mend-autopilot: one item, one pull request</text>
  <path d="M 410 106 H 904 M 410 100 V 112 M 904 100 V 112" stroke="#3A3F3C" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
  <text x="657" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#8A8A8A">mend-lite</text>
  <path d="M 926 106 H 1248 M 926 100 V 112 M 1248 100 V 112" stroke="#3A3F3C" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
  <text x="1087" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#8A8A8A">mend-lite-pr</text>
  <rect x="28" y="136" width="1224" height="116" rx="10" fill="none" stroke="#262626"/>
  <text x="48" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FAFAFA">You</text>
  <text x="48" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">write the item,</text>
  <text x="48" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">approve the merge</text>
  <rect x="28" y="260" width="1224" height="116" rx="10" fill="none" stroke="#262626"/>
  <text x="48" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FAFAFA">Strong model</text>
  <text x="48" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">specs and reviews,</text>
  <text x="48" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">never writes code</text>
  <rect x="28" y="384" width="1224" height="116" rx="10" fill="none" stroke="#262626"/>
  <text x="48" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FAFAFA">Cheap model</text>
  <text x="48" y="455" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">does the work in</text>
  <text x="48" y="473" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">its own worktree</text>
  <rect x="28" y="508" width="1224" height="116" rx="10" fill="none" stroke="#262626"/>
  <text x="48" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#FAFAFA">Programs</text>
  <text x="48" y="579" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">decide what counts</text>
  <text x="48" y="597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8A8A8A">as verified</text>
  <rect x="238" y="155" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="313" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">item</text><text x="313" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">goal, checks</text>
  <rect x="410" y="279" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="485" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">spec</text>
  <rect x="582" y="403" width="150" height="78" rx="8" fill="#121212" stroke="#9FB08E" stroke-width="1.5" stroke-dasharray="5 5"/><text x="657" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">implement</text><text x="657" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">and commit</text>
  <rect x="754" y="527" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="829" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">checks, scope</text><text x="829" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">integrity</text>
  <rect x="754" y="279" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="829" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">review</text>
  <rect x="926" y="527" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="1001" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">checks again</text><text x="1001" y="582" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">red-green</text>
  <rect x="926" y="279" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="1001" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">auditor</text><text x="1001" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">own session</text>
  <rect x="1098" y="527" width="150" height="78" rx="8" fill="#121212" stroke="#5FB3A6" stroke-width="1.5"/><text x="1173" y="571" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#5FB3A6">evidence card</text>
  <rect x="1098" y="155" width="150" height="78" rx="8" fill="#121212" stroke="#3A3F3C" stroke-width="1.5"/><text x="1173" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">approve</text><text x="1173" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" text-anchor="middle" fill="#FAFAFA">the merge</text>
